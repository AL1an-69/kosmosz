{% extends "base.html" %}

{% block title %}Подать заявку — KosmosZ{% endblock %}

{% block content %}
<div class="container">
<section class="page-header">
    <h1>Подать заявку на миссию</h1>
    <p class="page-subtitle"><em>{{ mission.title }}</em></p>
</section>

{% if errors %}
<div class="errors">
    <ul>
        {% for error in errors %}
        <li>{{ error }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}

<form method="POST" class="application-form">
    <div class="form-group">
        <label for="commander">Командир</label>
        <input type="text" id="commander" name="commander" value="{{ form_data.get('commander', '') }}" required>
    </div>

    <div class="form-group">
        <label for="crew_size">Размер экипажа</label>
        <input type="number" id="crew_size" name="crew_size" value="{{ form_data.get('crew_size', '') }}" min="1" max="20" required>
    </div>

    <div class="form-group">
        <label for="launch_date">Дата запуска</label>
        <input type="date" id="launch_date" name="launch_date" value="{{ form_data.get('launch_date', '') }}" min="{{ min_date }}" required>
    </div>

    <div class="form-group">
        <label for="goal">Цель миссии</label>
        <textarea id="goal" name="goal" rows="6" required>{{ form_data.get('goal', '') }}</textarea>
    </div>

    <button type="submit" class="btn">Подать заявку</button>
</form>

<p class="back-link"><a href="{{ url_for('mission_detail', mission_id=mission.id) }}">← Назад к миссии</a></p>
</div>
{% endblock %}
